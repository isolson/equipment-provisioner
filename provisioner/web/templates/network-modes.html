<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wired modes · Provisioner</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e5edf5;background:#111820}body{max-width:820px;margin:32px auto;padding:0 24px}a{color:#8ecaff}h1{font-size:30px;margin-bottom:8px}.muted{color:#acbac8}section{background:#1b2632;border:1px solid #344555;border-radius:12px;padding:24px;margin:20px 0}button,input,select{font:inherit;padding:14px;border-radius:8px;border:1px solid #536778;background:#17212b;color:inherit}button{cursor:pointer}button.primary{background:#286d9e;border-color:#3984b7}button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:block;margin:12px 0}input{box-sizing:border-box;max-width:100%}.choice{border:1px solid #536778;padding:16px;border-radius:8px;cursor:pointer}.choice input{margin-right:12px}small{display:block;margin:8px 0 0 32px;color:#acbac8}#message{white-space:pre-wrap;min-height:24px}details{margin-top:20px}summary{cursor:pointer}[hidden]{display:none!important}
</style></head><body>
<a href="/">← Provisioner</a><h1>Router or switch</h1><p class="muted">Choose the wired role after checking the connected device.</p>
<section><div class="row"><label for="port">Provisioner port</label><select id="port"></select><button id="refresh">Refresh devices</button><button id="inspect">Inspect</button></div><p id="device" class="muted"></p><p id="message" role="status" aria-live="polite"></p>
<div id="modes" hidden><div id="choices"></div><p id="management" class="muted"></p><button id="apply" class="primary">Apply selected mode</button></div>
<details><summary>Device login</summary><p class="muted">Use the device’s current credentials if its saved login is unavailable.</p><label>Username <input id="username" value="admin" autocomplete="username"></label><label>Password <input id="password" type="password" autocomplete="current-password"></label><button id="login">Use login and inspect</button></details>
</section>
<script>
const $=id=>document.getElementById(id);let devices=[],snapshot=null,busy=false;
function message(text){$('message').textContent=text;}
function working(value){busy=value;['refresh','inspect','apply','login','port'].forEach(id=>$(id).disabled=value);}
async function api(path,options){const response=await fetch(path,options);const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'The request could not be completed.');return data;}
function selected(){return devices.find(d=>String(d.port)===$('port').value);}
async function refresh(){working(true);snapshot=null;$('modes').hidden=true;try{devices=await api('/api/network-modes');$('port').replaceChildren();for(const d of devices){const option=document.createElement('option');option.value=d.port;option.textContent=`Port ${d.port} · ${d.model||'Detected device'}${d.busy?' · busy':''}`;$('port').append(option);}message(devices.length?'Select a port and inspect its current mode.':'No supported wired device detected. Connect the device and refresh.');}catch(e){message(e.message);}finally{working(false);}}
async function inspect(){const d=selected();if(!d)return;working(true);snapshot=null;$('modes').hidden=true;message('Reading device configuration…');try{snapshot=await api(`/api/network-modes/${d.port}`);$('device').textContent=`Port ${d.port} · ${snapshot.model} · Firmware ${snapshot.firmware}`;const choices=new Set(snapshot.choices.map(x=>x.value));$('choices').replaceChildren();for(const choice of snapshot.choices){const label=document.createElement('label');label.className='choice';const input=document.createElement('input');input.type='radio';input.name='mode';input.value=choice.value;input.checked=choice.value===snapshot.mode;label.append(input,document.createTextNode(choice.label));const detail=document.createElement('small');detail.textContent=choice.description;label.append(detail);$('choices').append(label);}$('management').textContent=snapshot.management_note;$('modes').hidden=!choices.size;message(choices.size?`Current mode: ${snapshot.mode==='custom'?'mixed settings':snapshot.mode}. Choose a role to apply and verify.`:'This model/firmware has no verified mode transitions yet.');}catch(e){message(e.message);}finally{working(false);}}
$('refresh').onclick=refresh;$('inspect').onclick=inspect;$('port').onchange=()=>{snapshot=null;$('modes').hidden=true;message('Inspect this port before choosing a mode.');};
$('login').onclick=async()=>{const d=selected();if(!d)return;working(true);try{await api('/api/credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port_number:d.port,device_type:d.device_type,username:$('username').value,password:$('password').value})});$('password').value='';working(false);await inspect();}catch(e){message(e.message);working(false);}};
$('apply').onclick=async()=>{const d=selected(),mode=document.querySelector('input[name=mode]:checked');if(!d||!snapshot||!mode){message('Select a mode first.');return;}working(true);message('Applying and verifying the selected mode…');try{const result=await api(`/api/network-modes/${d.port}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode.value,device_token:snapshot.device_token})});snapshot=result;message(`${result.choices.find(x=>x.value===result.mode)?.label||result.mode} mode applied and read back successfully.`);}catch(e){snapshot=null;$('modes').hidden=true;message(e.message);}finally{working(false);}};
refresh();
</script></body></html>
