            const password = document.getElementById('custom-password')?.value;
            const saveDefault = document.getElementById('save-credential-default')?.checked;
            const port = ports[portNum];

            if (!username || !password) {
                showToast('Please enter username and password', 'error');
                return;
            }

            // Clear the needs_credentials flag
            if (ports[portNum]) {
                ports[portNum].needs_credentials = false;
            }

            try {
                if (saveDefault && port?.device_type) {
                    try {
                        await fetch(`/api/default-credentials/${encodeURIComponent(port.device_type)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password }),
                        });
                    } catch (e) {
                        console.warn('Failed to save default credential:', e);
                    }
                }

                const response = await fetch('/api/provision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        port_number: portNum,
                        custom_username: username,
                        custom_password: password,
                    }),
                });

                const data = await response.json();
                if (response.ok) {
                    showToast('Retrying with new credentials...', 'success');
                    closeModal();
                } else {
                    showToast(data.detail || 'Failed to start', 'error');
                }
            } catch (error) {
                showToast('Failed to retry provisioning', 'error');
            }
        }

        function closeModal() {
            selectedPort = null;
            document.getElementById('port-modal').classList.add('hidden');
        }

        async function startProvisioning(portNum) {
            const username = document.getElementById('custom-username')?.value || null;
            const password = document.getElementById('custom-password')?.value || null;
            const skipFirmware = document.getElementById('skip-firmware')?.checked || false;
            const skipConfig = document.getElementById('skip-config')?.checked || false;
            const operatorIdEl = document.getElementById('operator-id');
            const operatorId = operatorIdEl?.value ? parseInt(operatorIdEl.value) : null;

            try {
                const body = {
                    port_number: portNum,
                    custom_username: username,
                    custom_password: password,
                    skip_firmware: skipFirmware,
                    skip_config: skipConfig,
                };
                if (operatorId !== null) body.operator_id = operatorId;

                const response = await fetch('/api/provision', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });

                const data = await response.json();
                if (response.ok) {
                    showToast('Provisioning started', 'success');
                    closeModal();
                } else {
                    showToast(data.detail || 'Failed to start', 'error');
                }
            } catch (error) {
                showToast('Failed to start provisioning', 'error');
            }
        }

        async function startNetinstall(portNum) {
            try {
                const response = await fetch('/api/netinstall', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port_number: portNum }),
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('Netinstall started', 'success');
                    closeModal();
                } else {
                    showToast(data.detail || 'Failed to start Netinstall', 'error');
                }
            } catch (error) {
                showToast('Failed to start Netinstall', 'error');
            }
        }

        // History Modal

        function openHistoryModal() {
            document.getElementById('history-modal').classList.remove('hidden');
            fetchHistory();
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').classList.add('hidden');
        }

        async function fetchHistory() {
            try {
                const response = await fetch('/api/jobs?limit=50');
                const jobs = await response.json();
                renderHistory(jobs);
            } catch (error) {
                document.getElementById('history-content').innerHTML = '<div class="text-red-700 text-center py-4">Failed to load</div>';
            }
        }

        function renderHistory(jobs) {
            const container = document.getElementById('history-content');
            if (jobs.length === 0) {
                container.innerHTML = '<div class="text-gray-600 text-center py-8">No history</div>';
                return;
            }

            container.innerHTML = jobs.map((job, i) => {
                const vendor = deviceVendors[job.device_type] || deviceVendors.unknown;
                const isOk = job.status === 'completed';
                const isFail = job.status === 'failed';
                const statusColor = isOk ? '#166534' : isFail ? '#991b1b' : '#6b7280';
                const statusIcon = isOk ? '\u2713' : isFail ? '\u2717' : '\u25cf';
                const statusText = job.status?.toUpperCase();
                const ident = job.mac_address || job.serial_number || '';
                const identLabel = job.mac_address && job.serial_number
                    ? `${job.mac_address} / ${job.serial_number}`
                    : ident;

                // Build detail rows for expand
                const details = [];
                if (job.mac_address) details.push(['MAC', job.mac_address]);
                if (job.serial_number) details.push(['Serial', job.serial_number]);
                if (job.ip_address) details.push(['IP', job.ip_address]);
                if (job.device_model) details.push(['Model', job.device_model]);
                if (job.old_firmware) details.push(['FW Before', job.old_firmware]);
                if (job.new_firmware) details.push(['FW After', job.new_firmware]);
                if (job.config_applied) details.push(['Config', job.config_applied]);
                if (job.started_at) details.push(['Started', new Date(job.started_at).toLocaleString('en-US', { hour12: false })]);
                if (job.completed_at) details.push(['Completed', new Date(job.completed_at).toLocaleString('en-US', { hour12: false })]);
                if (job.error_message) details.push(['Error', job.error_message]);

                return `
                    <div class="border-b border-gray-200">
                        <div class="flex items-center gap-3 py-3 cursor-pointer hover:bg-gray-50 px-1 rounded" onclick="toggleHistoryDetail(${i})">
                            <span style="color:${statusColor};font-size:14px;width:16px;text-align:center">${statusIcon}</span>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 text-sm">
                                    <span class="font-medium inline-flex items-center gap-1" style="color:${vendor.color}">${vendor.icon ? `<img src="${vendor.icon}" class="w-4 h-4 rounded object-contain" alt="">` : ''}${vendor.name}</span>
                                    <span class="text-gray-900">${job.device_model || ''}</span>
                                    <span class="text-gray-400">Port ${job.port_number || '?'}</span>
                                </div>
                                <div class="text-xs text-gray-500 truncate font-mono">${identLabel}</div>
                            </div>
                            <div class="text-right flex-shrink-0">
                                <div class="text-xs font-medium" style="color:${statusColor}">${statusText}</div>
                                <div class="text-xs text-gray-400">${formatTime(job.started_at)}</div>
                            </div>
                            <svg class="w-4 h-4 text-gray-400 transition-transform" id="history-chevron-${i}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </div>
                        <div id="history-detail-${i}" class="hidden pb-3 px-1">
                            <div style="display:grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; padding: 8px 12px; background: #f9fafb; border-radius: 6px; margin-left: 28px;">
                                ${details.map(([label, value]) => `
                                    <span style="color:#9ca3af">${label}</span>
                                    <span class="${label === 'Error' ? 'text-red-700' : 'text-gray-900'}" style="font-family:monospace;word-break:break-all">${value}</span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleHistoryDetail(index) {
            const detail = document.getElementById(`history-detail-${index}`);
            const chevron = document.getElementById(`history-chevron-${index}`);
            if (detail) {
                detail.classList.toggle('hidden');
                chevron?.classList.toggle('rotate-180');
            }
        }

        // Settings
        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
            fetchSystemStatus();
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        async function fetchSystemStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                document.getElementById('system-status').innerHTML = `
                    <div class="grid grid-cols-2 gap-1 text-sm">
                        <div class="text-gray-600">Status</div>
                        <div class="${status.running ? 'text-green-700' : 'text-red-700'} font-medium">${status.running ? 'RUNNING' : 'STOPPED'}</div>
                        <div class="text-gray-600">Mode</div>
                        <div class="text-gray-900">${status.mode?.toUpperCase() || 'VLAN'}</div>
                        <div class="text-gray-600">Active Ports</div>
                        <div class="text-gray-900">${status.active_ports || 0} / ${status.total_ports || 6}</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('system-status').innerHTML = '<div class="text-red-700">Failed to load</div>';
            }
        }


        function initLabelPrinterUi() {
            if (!LABEL_PRINTER_CONFIG.enabled) {
                updateLabelPrinterState('disabled', '');
                return;
            }
            window.addEventListener('storage', (event) => {
                if (event.key === LABEL_PRINT_QUEUE_KEY || event.key === LABEL_PRINTED_KEY) {
                    updateLabelPrinterButton();
                }
            });
            updateLabelPrinterState('disconnected', 'M211 disconnected');
        }

        function updateLabelPrinterState(state, detail) {
            labelPrinterState = state;
            labelPrinterDetail = detail || '';
            updateLabelPrinterButton();
        }

        function updateLabelPrinterButton() {
            const button = document.getElementById('label-printer-button');
            const badge = document.getElementById('label-printer-queue-badge');
            if (!button || !badge) return;
            if (!LABEL_PRINTER_CONFIG.enabled) {
                button.classList.add('hidden');
                return;
            }

            button.classList.remove('hidden');
            if (labelPrinterState === 'connected') button.style.background = '#dcfce7';
            else if (labelPrinterState === 'connecting' || labelPrinterState === 'printing') button.style.background = '#dbeafe';
            else if (labelPrinterState === 'error') button.style.background = '#fee2e2';
            else button.style.background = '#fef3c7';

            const queued = readLabelQueue().length;
            badge.textContent = queued > 0 ? String(queued) : '';
            badge.classList.toggle('hidden', queued === 0);
            const suffix = queued > 0 ? ` (${queued} queued)` : '';
            button.title = `${labelPrinterDetail || 'Label printer'}${suffix}`;
        }

        async function ensureBradySdk() {
            if (bradySdk) return bradySdk;
            if (!bradySdkLoadPromise) {
                bradySdkLoadPromise = import('/static/vendor/brady-web-sdk/bundle.js')
                    .then(module => {
                        BradySdkClass = module.default;
                        bradySdk = new BradySdkClass(onBradyPrinterUpdate, false);
                        onBradyPrinterUpdate(null);
                        return bradySdk;
                    });
            }
            return bradySdkLoadPromise;
        }

        function isLabelPrinterConnected() {
            try {
                return !!(bradySdk && bradySdk.isConnected && bradySdk.isConnected());
            } catch (error) {
                return false;
            }
        }

        function onBradyPrinterUpdate() {
            if (!LABEL_PRINTER_CONFIG.enabled || !bradySdk) return;
            if (isLabelPrinterConnected()) {
                const parts = [
                    bradySdk.printerName || bradySdk.printerModel || 'M211',
                    bradySdk.supplyName,
                    bradySdk.batteryLevelPercentage !== undefined ? `${bradySdk.batteryLevelPercentage}%` : '',
                ].filter(Boolean);
                updateLabelPrinterState('connected', parts.join(' / ') || 'M211 connected');
                processLabelPrintQueue();
                return;
            }
            if (labelPrinterState !== 'connecting' && labelPrinterState !== 'printing') {
                updateLabelPrinterState('disconnected', 'M211 disconnected');
            }
        }

        async function connectLabelPrinter() {
            if (!LABEL_PRINTER_CONFIG.enabled) return;
            try {
                updateLabelPrinterState('connecting', 'Pairing M211...');
                const sdk = await ensureBradySdk();
                if (sdk.isSupportedBrowser && !sdk.isSupportedBrowser()) {
                    updateLabelPrinterState('error', 'Browser does not support Web Bluetooth');
                    showToast('Browser does not support Web Bluetooth', 'error');
                    return;
                }
                const savedOwnershipId = localStorage.getItem(LABEL_PRINTER_OWNERSHIP_KEY);
                const connected = await sdk.showDiscoveredBleDevices(savedOwnershipId);
                if (!connected) {
                    updateLabelPrinterState('error', 'M211 pairing failed');
                    showToast('M211 pairing failed', 'error');
                    return;
                }
                onBradyPrinterUpdate(null);
                showToast('M211 label printer connected', 'success');
                await processLabelPrintQueue();
            } catch (error) {
                console.error('M211 pairing failed:', error);
                updateLabelPrinterState('error', 'M211 pairing failed');
                showToast('M211 pairing failed', 'error');
            }
        }

        function labelBaseId(label) {
            return `${label.type || 'label'}:${label.serial || ''}:${label.mac || ''}`;
        }

        function normalizeLabel(label, portNumber, force = false) {
            const copies = Number.parseInt(label.copies || LABEL_PRINTER_CONFIG.copies || 1, 10);
            const baseId = labelBaseId(label);
            return {
                type: label.type || 'mikrotik_netinstall',
                serial: label.serial || '',
                mac: label.mac || '',
                model: label.model || '',
                copies: Number.isFinite(copies) && copies > 0 ? copies : 1,
                port_number: portNumber,
                base_id: baseId,
                queue_id: force ? `${baseId}:manual:${Date.now()}` : baseId,
                force: force,
            };
        }

        function readJsonLocalStorage(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                return raw ? JSON.parse(raw) : fallback;
            } catch (error) {
                return fallback;
            }
        }

        function writeJsonLocalStorage(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function readLabelQueue() {
            return readJsonLocalStorage(LABEL_PRINT_QUEUE_KEY, []);
        }

        function writeLabelQueue(queue) {
            writeJsonLocalStorage(LABEL_PRINT_QUEUE_KEY, queue.slice(-20));
            updateLabelPrinterButton();
        }

        function readPrintedLabelIds() {
            return readJsonLocalStorage(LABEL_PRINTED_KEY, []);
        }

        function markLabelPrinted(label) {
            const printed = readPrintedLabelIds().filter(id => id !== label.base_id);
            printed.push(label.base_id);
            writeJsonLocalStorage(LABEL_PRINTED_KEY, printed.slice(-100));
        }

        function isLabelPrinted(label) {
            return readPrintedLabelIds().includes(label.base_id);
        }

        function addLabelToQueue(label) {
            const queue = readLabelQueue();
            if (!queue.some(item => item.queue_id === label.queue_id)) {
                queue.push(label);
                writeLabelQueue(queue);
            }
        }

        function removeLabelFromQueue(label) {
            writeLabelQueue(readLabelQueue().filter(item => item.queue_id !== label.queue_id));
        }

        function acquireLabelPrintLease() {
            const now = Date.now();
            const lease = readJsonLocalStorage(LABEL_PRINT_LEASE_KEY, null);
            if (lease && lease.owner && lease.owner !== LABEL_PRINTER_OWNER_ID && lease.expires > now) {
                return false;
            }
            writeJsonLocalStorage(LABEL_PRINT_LEASE_KEY, {
                owner: LABEL_PRINTER_OWNER_ID,
                expires: now + 60000,
            });
            return true;
        }

        function releaseLabelPrintLease() {
            const lease = readJsonLocalStorage(LABEL_PRINT_LEASE_KEY, null);
            if (lease && lease.owner === LABEL_PRINTER_OWNER_ID) {
                localStorage.removeItem(LABEL_PRINT_LEASE_KEY);
            }
        }

        function handleCompletedLabel(portNumber, rawLabel) {
            if (!LABEL_PRINTER_CONFIG.enabled) return;
            const label = normalizeLabel(rawLabel, portNumber, false);
            if (!label.serial || !label.mac) return;
            lastLabelByPort[portNumber] = label;
            if (ports[portNumber]) {
                ports[portNumber].last_label = label;
            }
            if (!LABEL_PRINTER_CONFIG.auto_print_mikrotik_netinstall) return;
            if (!isLabelPrinted(label)) {
                addLabelToQueue(label);
                showToast('MikroTik label queued', 'info');
            }
            processLabelPrintQueue();
        }

        async function reprintLastLabel(portNumber) {
            const label = lastLabelByPort[portNumber] || ports[portNumber]?.last_label;
            if (!label) {
                showToast('No label available for this port', 'warning');
                return;
            }
            const queued = normalizeLabel(label, portNumber, true);
            addLabelToQueue(queued);
            showToast('Label queued for reprint', 'info');
            await processLabelPrintQueue();
        }

        async function processLabelPrintQueue() {
            if (!LABEL_PRINTER_CONFIG.enabled || labelPrinterBusy) return;
            if (!isLabelPrinterConnected()) {
                if (readLabelQueue().length > 0) {
                    updateLabelPrinterState('disconnected', 'M211 disconnected; label queued');
                }
                return;
            }
            if (!acquireLabelPrintLease()) return;

            labelPrinterBusy = true;
            try {
                let queue = readLabelQueue();
                while (queue.length > 0 && isLabelPrinterConnected()) {
                    const label = queue[0];
                    if (!label.force && isLabelPrinted(label)) {
                        removeLabelFromQueue(label);
                        queue = readLabelQueue();
                        continue;
                    }
                    updateLabelPrinterState('printing', `Printing ${label.serial}`);
                    await printLabel(label);
                    markLabelPrinted(label);
                    removeLabelFromQueue(label);
                    showToast(`Printed label for ${label.serial}`, 'success');
                    queue = readLabelQueue();
                }
            } catch (error) {
                console.error('M211 print failed:', error);
                updateLabelPrinterState('error', 'M211 print failed; label queued');
                showToast('M211 print failed; label remains queued', 'error');
            } finally {
                labelPrinterBusy = false;
                releaseLabelPrintLease();
                onBradyPrinterUpdate(null);
            }
        }

        async function printLabel(label) {
            const sdk = await ensureBradySdk();
            if (!isLabelPrinterConnected()) {
                throw new Error('M211 is not connected');
            }
            sdk.setCopies(label.copies || 1);
            sdk.setCutOption(0);
            const image = await renderMikrotikLabelImage(label);
            const ok = await sdk.printBitmap(image);
            if (!ok) {
                throw new Error('Brady SDK returned false from printBitmap');
            }
        }

        async function renderMikrotikLabelImage(label) {
            const canvas = document.createElement('canvas');
            canvas.width = 900;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#000000';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';

            const lines = [`S/N ${label.serial}`, `MAC ${label.mac}`];
            let fontSize = 72;
            do {
                ctx.font = `700 ${fontSize}px Menlo, Consolas, monospace`;
                if (lines.every(line => ctx.measureText(line).width <= canvas.width - 80)) break;
                fontSize -= 4;
            } while (fontSize > 34);

            const lineGap = Math.round(fontSize * 1.25);
            const startY = Math.round((canvas.height - lineGap) / 2);
            ctx.font = `700 ${fontSize}px Menlo, Consolas, monospace`;
            ctx.fillText(lines[0], 40, startY);
            ctx.fillText(lines[1], 40, startY + lineGap);

            const img = new Image();
            img.width = canvas.width;
            img.height = canvas.height;
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = reject;
                img.src = canvas.toDataURL('image/png');
            });
            return img;
        }

        // Toast
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-green-600',
                error: 'bg-red-600',
                warning: 'bg-yellow-600',
                info: 'bg-blue-600',
            };
            toast.className = `${colors[type]} text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transform transition-all duration-300 translate-x-full`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-x-full'));
            setTimeout(() => {
                toast.classList.add('translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function formatTime(isoString) {
            if (!isoString) return '-';
            const date = new Date(isoString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const timeStr = date.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
            // Today: show time + relative
            if (diffMins < 1) return `${timeStr} (now)`;
            if (diffMins < 60) return `${timeStr} (${diffMins}m ago)`;
            if (diffMins < 1440) return `${timeStr} (${Math.floor(diffMins / 60)}h ago)`;
            // Older: show date + time
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + timeStr;
        }

        // Display Sleep/Wake Functions

        async function fetchDisplayConfig() {
            try {
                const response = await fetch('/api/display/status');
                const status = await response.json();
                if (status.available) {
                    displayConfig.sleep_timeout = status.sleep_timeout || 300;
                    displayConfig.wake_on_connect = status.wake_on_connect !== false;
                    displaySleeping = status.sleeping || false;
                    updateSleepOverlay();
                }
            } catch (error) {
                console.log('Display config not available:', error);
            }
        }

        function checkIdleState() {
            // Skip if sleep timeout is disabled
            if (displayConfig.sleep_timeout <= 0) {
                clearIdleTimeout();
                return;
            }

            // Count connected devices (link up or device detected)
            const hasDevices = Object.values(ports).some(p => p.link_up || p.device_detected);

            if (!hasDevices && !displaySleeping) {
                // No devices - start/reset idle timer
                startIdleTimeout();
            } else {
                // Devices connected - clear timer
                clearIdleTimeout();
                // Wake if sleeping and wake_on_connect is enabled
                if (displaySleeping && displayConfig.wake_on_connect) {
                    wakeDisplay();
                }
            }
        }

        function startIdleTimeout() {
            clearIdleTimeout();
            const timeoutMs = displayConfig.sleep_timeout * 1000;
            idleTimeout = setTimeout(sleepDisplay, timeoutMs);
        }

        function clearIdleTimeout() {
            if (idleTimeout) {
                clearTimeout(idleTimeout);
                idleTimeout = null;
            }
        }

        async function sleepDisplay() {
            if (displaySleeping) return;

            // Show overlay immediately for visual feedback
            displaySleeping = true;
            updateSleepOverlay();

            // Call backend to actually sleep the display
            try {
                await fetch('/api/display/sleep', { method: 'POST' });
            } catch (error) {
                console.log('Failed to sleep display:', error);
            }
        }

        async function wakeDisplay() {
            if (!displaySleeping) return;

            // Hide overlay immediately for visual feedback
            displaySleeping = false;
            updateSleepOverlay();

            // Call backend to wake the display
            try {
                await fetch('/api/display/wake', { method: 'POST' });
            } catch (error) {
                console.log('Failed to wake display:', error);
            }

            // Reset idle timer
            checkIdleState();
        }

        function updateSleepOverlay() {
            const overlay = document.getElementById('sleep-overlay');
            if (overlay) {
                if (displaySleeping) {
                    overlay.classList.add('active');
                } else {
                    overlay.classList.remove('active');
                }
            }
        }

        function handleDisplayStateMessage(message) {
            displaySleeping = message.sleeping;
            updateSleepOverlay();
        }
    </script>
