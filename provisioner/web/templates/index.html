<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ title }}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="/static/tailwindcss.js"></script>
    <script>
        tailwind.config = { theme: { extend: {} } }
    </script>
    <style>
        /* ------------------------------------------------------------
           Operations console theme (light, high contrast for a 7-inch outdoor panel).
           Status is never color alone: each tone pairs with an icon and a
           word. See STANDARDS.md section 3 for touch and size rules.
           ------------------------------------------------------------ */
        :root {
            --bg: #eef1f6;
            --panel: #ffffff;
            --panel-2: #f4f6fa;
            --panel-3: #e6eaf2;
            --line: #cfd6e2;
            --line-strong: #9aa8bd;
            --fg: #0f172a;
            --fg-muted: #475569;
            --fg-dim: #64748b;
            --tone-idle: #94a3b8;
            --tone-active: #0369a1;
            --tone-success: #15803d;
            --tone-warning: #b45309;
            --tone-error: #b91c1c;
            --tone-stale: #64748b;
            --tint-idle: #f1f5f9;
            --tint-active: #e0f2fe;
            --tint-success: #dcfce7;
            --tint-warning: #fef3c7;
            --tint-error: #fee2e2;
            --radius: 12px;
            --mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Menlo', 'Consolas', monospace;
            --sans: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; box-sizing: border-box; }
        html, body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
        .mono { font-family: var(--mono); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--panel); }
        ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }

        /* Header */
        .console-header { background: var(--panel); border-bottom: 1px solid var(--line); }
        .header-btn { min-width: 48px; min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--fg-muted); border: 1px solid transparent; }
        .header-btn:active { background: var(--panel-3); }
        .version-tag { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
        .live-dot { width: 10px; height: 10px; border-radius: 999px; background: var(--tone-success); box-shadow: 0 0 0 3px #dcfce7; }
        .live-dot.stale { background: var(--tone-stale); box-shadow: 0 0 0 3px #e2e8f0; }
        .live-dot.down { background: var(--tone-error); box-shadow: 0 0 0 3px #fee2e2; }

        /* Stale banner */
        #stale-banner { background: var(--tint-warning); border-bottom: 1px solid var(--tone-warning); color: #78350f; font-size: 14px; font-weight: 600; padding: 10px 16px; }

        /* Port card: 250px, identity strip / status center / footer strip */
        .port-card {
            height: clamp(250px, calc((100vh - 150px) / 2), 360px); position: relative; display: flex; flex-direction: column;
            background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
            overflow: hidden; cursor: default; transition: border-color 150ms ease;
        }
        .port-card[data-clickable="true"] { cursor: pointer; }
        .port-card[data-clickable="true"]:active { border-color: var(--line-strong); }
        .card-rail { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--tone-idle); }
        .port-card[data-tone="idle"] .card-rail { background: repeating-linear-gradient(180deg, var(--tone-idle) 0 8px, transparent 8px 14px); }
        .port-card[data-tone="active"] .card-rail { background: var(--tone-active); }
        .port-card[data-tone="success"] .card-rail { background: var(--tone-success); }
        .port-card[data-tone="warning"] .card-rail { background: var(--tone-warning); }
        .port-card[data-tone="error"] .card-rail { background: var(--tone-error); }
        .port-card[data-tone="idle"] { background: var(--panel-2); }
        .card-identity { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); font-size: 15px; color: var(--fg-muted); }
        .card-identity .port-badge { font-family: var(--mono); font-weight: 800; font-size: 16px; color: var(--fg); background: var(--panel-3); border-radius: 6px; padding: 2px 9px; }
        .vendor-pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--vendor-color, var(--fg)); }
        .vendor-pill img { width: 20px; height: 20px; border-radius: 4px; object-fit: contain; }
        .card-model { font-weight: 700; color: var(--fg); }
        .card-status { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; text-align: center; }
        .status-icon { width: 72px; height: 72px; display: flex; align-items: center; justify-content: center; }
        .status-icon svg { width: 60px; height: 60px; }
        .status-headline { font-size: 30px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.1; }
        .status-detail { font-size: 17px; color: var(--fg-muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tone-idle .status-headline, .tone-idle .status-icon { color: var(--tone-idle); }
        .tone-active .status-headline, .tone-active .status-icon { color: var(--tone-active); }
        .tone-success .status-headline, .tone-success .status-icon { color: var(--tone-success); }
        .tone-warning .status-headline, .tone-warning .status-icon { color: var(--tone-warning); }
        .tone-error .status-headline, .tone-error .status-icon { color: var(--tone-error); }
        .progress-track { width: 70%; height: 8px; background: var(--panel-3); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--tone-active); border-radius: 999px; transition: width 300ms ease; }
        .card-footer { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; border-top: 1px solid var(--line); font-size: 14px; color: var(--fg-dim); }
        .mode-chip { font-family: var(--mono); font-weight: 800; font-size: 14px; color: var(--fg); background: var(--panel-3); border-radius: 6px; padding: 3px 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1.1s linear infinite; }

        /* Modal sheet with fixed action bar */
        .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; color: var(--fg); }
        .sheet-head { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
        .sheet-title { font-size: 18px; font-weight: 800; }
        .sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
        .sheet-foot { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel-2); }
        .region { margin-bottom: 14px; }
        .region:empty { display: none; }
        .summary-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
        .summary-grid .k { color: var(--fg-dim); }
        .summary-grid .v { font-family: var(--mono); color: var(--fg); word-break: break-all; }
        .notice { border-radius: 10px; padding: 12px 14px; border: 1px solid; font-size: 14px; }
        .notice-title { font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .notice.tone-error { background: var(--tint-error); border-color: var(--tone-error); color: #7f1d1d; }
        .notice.tone-warning { background: var(--tint-warning); border-color: var(--tone-warning); color: #78350f; }
        .notice.tone-success { background: var(--tint-success); border-color: var(--tone-success); color: #14532d; }
        .notice.tone-active { background: var(--tint-active); border-color: var(--tone-active); color: #0c4a6e; }
        .notice.tone-idle { background: var(--tint-idle); border-color: var(--line-strong); color: var(--fg-muted); }
        .notice-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .timeline { border: 1px solid var(--line); border-radius: 10px; max-height: 240px; overflow-y: auto; background: var(--panel-2); }
        .timeline-row { display: grid; grid-template-columns: 58px 22px 1fr; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 13px; align-items: start; }
        .timeline-row:last-child { border-bottom: 0; }
        .timeline-time { font-family: var(--mono); color: var(--fg-dim); font-size: 12px; padding-top: 1px; }
        .timeline-glyph { font-weight: 800; text-align: center; }
        .timeline-label { color: var(--fg); }
        .timeline-detail { color: var(--fg-muted); font-size: 12px; font-family: var(--mono); word-break: break-word; }
        .section-title { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 8px; }

        /* Buttons: 48px minimum, 12px gaps */
        .modal-action { min-height: 48px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; }
        .modal-action-primary { background: var(--tone-active); color: #ffffff; }
        .modal-action-secondary { background: var(--panel-3); color: var(--fg); border-color: var(--line-strong); }
        .modal-action-danger { background: var(--tone-error); color: #fff; }
        .modal-action-warning { background: var(--tone-warning); color: #ffffff; }
        .modal-action:disabled { opacity: 0.45; }
        .workflow-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .workflow-actions-grid.single { grid-template-columns: 1fr; }
        .transition-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); }
        .transition-row.disabled { opacity: 0.55; }
        .transition-reason { font-size: 12px; color: var(--fg-muted); }
        .service-actions summary { min-height: 44px; display: flex; align-items: center; color: var(--fg-dim); cursor: pointer; font-size: 13px; font-weight: 700; }
        .service-action-button { width: 100%; min-height: 48px; border: 1px solid var(--tone-warning); border-radius: 10px; background: var(--tint-warning); color: #78350f; font-size: 14px; font-weight: 700; }
        .choice-btn { min-height: 48px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--panel-3); color: var(--fg); font-weight: 700; font-size: 15px; }
        .choice-btn.selected { background: var(--tone-active); color: #ffffff; border-color: var(--tone-active); }
        .field { width: 100%; min-height: 48px; background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; color: var(--fg); font-size: 16px; }
        .compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
        .compare .cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
        .compare .cell .k { font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.06em; }
        .compare .cell .v { font-family: var(--mono); font-size: 14px; word-break: break-all; }

        /* Theme mapping for carried-over subsystems that use light utility classes. */
        #port-modal .bg-gray-50, #port-modal .bg-white, #history-modal .bg-gray-50, #settings-modal .bg-gray-50,
        #history-modal .hover\:bg-gray-50:hover { background: var(--panel-2) !important; }
        #port-modal .text-gray-900, #history-modal .text-gray-900, #settings-modal .text-gray-900 { color: var(--fg) !important; }
        #port-modal .text-gray-600, #history-modal .text-gray-600, #settings-modal .text-gray-600, #history-modal .text-gray-500 { color: var(--fg-muted) !important; }
        #history-modal .text-gray-400 { color: var(--fg-dim) !important; }
        #port-modal .border-gray-200, #port-modal .border-gray-300, #history-modal .border-gray-200, #settings-modal .border-gray-200 { border-color: var(--line) !important; }
        #port-modal .bg-red-50 { background: var(--tint-error) !important; } #port-modal .border-red-300 { border-color: var(--tone-error) !important; }
        #port-modal .text-red-700, #history-modal .text-red-700, #settings-modal .text-red-700 { color: #7f1d1d !important; }
        #port-modal .bg-amber-50 { background: var(--tint-warning) !important; } #port-modal .border-amber-300 { border-color: var(--tone-warning) !important; }
        #port-modal .text-amber-700 { color: #78350f !important; }
        #settings-modal .text-green-700 { color: #14532d !important; }
        #port-modal input[type="text"], #port-modal input[type="password"], #port-modal input[type="number"] { background: var(--panel-2) !important; color: var(--fg) !important; border-color: var(--line-strong) !important; min-height: 48px; font-size: 16px; }
        #setup-readiness-banner.bg-green-50 { background: var(--tint-success); color: #14532d; }
        #setup-readiness-banner.bg-yellow-50 { background: var(--tint-warning); color: #78350f; }
        #setup-readiness-banner.bg-red-50 { background: var(--tint-error); color: #7f1d1d; }
        #setup-readiness-banner.bg-gray-50 { background: var(--tint-idle); color: var(--fg-muted); }
        #setup-readiness-banner .text-green-900, #setup-readiness-banner .text-yellow-900, #setup-readiness-banner .text-red-900, #setup-readiness-banner .text-gray-900 { color: inherit; }

        /* Sleep overlay */
        #sleep-overlay { position: fixed; inset: 0; background: #000; z-index: 9999; display: none; cursor: pointer; }
        #sleep-overlay.active { display: block; }

        /* Rotation: portrait becomes one column with shorter cards. */
        @media (orientation: portrait) {
            .port-card { height: clamp(180px, calc((100vh - 170px) / 3), 260px); }
            .status-headline { font-size: 24px; }
        }
        @media (max-width: 1100px) {
            .status-headline { font-size: 24px; }
            .status-icon { width: 60px; height: 60px; }
            .status-icon svg { width: 48px; height: 48px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden">
    <!-- Sleep Overlay - full screen black, click/touch to wake -->
    <div id="sleep-overlay" onclick="wakeDisplay()"></div>

    <header class="console-header px-4 py-2 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between flex-shrink-0">
        <div class="flex flex-wrap items-center gap-3 min-w-0">
            <div class="live-dot" id="connection-indicator" title="Live updates"></div>
            <h1 class="text-xl font-extrabold tracking-wide">Device Provisioner</h1>
            <span class="text-[11px] mono break-all" style="color: var(--fg-dim)" id="management-url"></span>
            <span class="version-tag" id="deployed-version" title="Deployed version">{{ deployed_version }}</span>
        </div>
        <div class="flex flex-wrap items-center gap-2 sm:justify-end">
            <span class="text-sm mono" style="color: var(--fg-muted)" id="clock"></span>
            <span class="text-sm" style="color: var(--fg-muted)" id="status-text">Connecting...</span>
            <a href="/files" class="header-btn" title="Manage">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            </a>
            <button onclick="openHistoryModal()" class="header-btn" title="History">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>
            <button onclick="openSettings()" class="header-btn" title="Settings">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </div>
    </header>

    <div id="stale-banner" class="hidden flex-shrink-0">Live updates paused. Reconnecting...</div>

    <!-- Setup Readiness Banner -->
    <div id="setup-readiness-banner" class="hidden flex-shrink-0 px-4 py-3" style="border-bottom: 1px solid var(--line)"></div>

    <main class="flex-1 overflow-y-auto px-4 py-3 flex items-start justify-center md:items-center">
        <div class="w-full max-w-[1500px]">
            <div class="grid grid-cols-1 gap-4 mb-4 sm:grid-cols-2 lg:grid-cols-3" id="port-row-top"></div>
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" id="port-row-bottom"></div>
        </div>
    </main>

    <!-- Port sheet: fixed regions, fixed action bar -->
    <div id="port-modal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0 bg-black/40" onclick="closeModal()"></div>
        <div class="sheet absolute inset-2 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-full md:max-w-lg overflow-hidden flex flex-col md:max-h-[92vh]">
            <div class="sheet-head">
                <h3 class="sheet-title" id="modal-title">Port</h3>
                <button onclick="closeModal()" class="header-btn" aria-label="Close port details">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="sheet-body" id="modal-content">
                <div class="region" id="modal-summary"></div>
                <div class="region" id="modal-notice"></div>
                <div class="region" id="modal-timeline"></div>
                <div class="region" id="modal-actions"></div>
            </div>
            <div class="sheet-foot flex flex-wrap justify-end gap-2" id="modal-footer"></div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="history-modal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0 bg-black/40" onclick="closeHistoryModal()"></div>
        <div class="sheet absolute inset-2 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-full md:max-w-2xl overflow-hidden flex flex-col md:max-h-[85vh]">
            <div class="sheet-head">
                <h3 class="sheet-title">Provisioning History</h3>
                <button onclick="closeHistoryModal()" class="header-btn" aria-label="Close history">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="sheet-body" id="history-content"><div class="text-center py-8" style="color: var(--fg-muted)">Loading...</div></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-50 hidden">
        <div class="modal-backdrop absolute inset-0 bg-black/40" onclick="closeSettings()"></div>
        <div class="sheet absolute inset-2 md:inset-auto md:top-1/2 md:left-1/2 md:-translate-x-1/2 md:-translate-y-1/2 md:w-full md:max-w-md overflow-hidden flex flex-col md:max-h-[85vh]">
            <div class="sheet-head">
                <h3 class="sheet-title">Settings</h3>
                <button onclick="closeSettings()" class="header-btn" aria-label="Close settings">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="sheet-body space-y-4">
                <div>
                    <div class="section-title">System Status</div>
                    <div class="rounded-lg p-3 text-sm" style="background: var(--panel-2); border: 1px solid var(--line)" id="system-status">Loading...</div>
                </div>
                <div>
                    <div class="section-title">Deployed</div>
                    <div class="rounded-lg p-3 text-sm mono" style="background: var(--panel-2); border: 1px solid var(--line)">{{ deployed_version or 'unknown' }}</div>
                </div>
                <div class="space-y-2">
                    <a href="/setup" class="modal-action modal-action-secondary w-full">Bench setup</a>
                    <button onclick="location.reload()" class="modal-action modal-action-secondary w-full">Refresh page</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

    <script>
        // Number of provisioning ports; injected from server config so the
        // grid renders correctly for both VLAN (6 ports) and single-port modes.
        const NUM_PORTS = {{ num_ports | default(6) }};
        const LABEL_PRINTER_CONFIG = {{ label_printer | tojson }};
        // Server-seeded first paint: no empty grid while the socket connects.
        const INITIAL_PORTS = {{ initial_ports | tojson }};

        // State
        let ws = null;
        let ports = {};
        let selectedPort = null;
        let reconnectAttempts = 0;
        let lastMessageAt = 0;
        let lastCardSig = {};
        let lastModalSig = {};
        let timelines = {};   // port -> { latest_seq, events: [] }
        let modalView = null; // { port, view, ...params }
        let previewTimer = null;
        let BradySdkClass = null;
        let bradySdk = null;
        let bradySdkLoadPromise = null;
        let labelPrinterState = 'disabled';
        let labelPrinterDetail = '';
        let labelPrinterBusy = false;
        let lastLabelByPort = {};
        const LABEL_PRINT_QUEUE_KEY = 'provisionerLabelPrintQueue';
        const LABEL_PRINTED_KEY = 'provisionerPrintedLabels';
        const LABEL_PRINT_LEASE_KEY = 'provisionerLabelPrintLease';
        let displaySleeping = false;
        let idleTimeout = null;
        let displayConfig = { sleep_timeout: 0, wake_on_connect: true };
        let readinessRefreshTimer = null;
        const SETUP_READINESS_DISMISSED_KEY = 'provisionerSetupReadinessDismissed';

        // Vendor metadata is injected server-side from the handler registry
        // (Story 5 / #75): adding a vendor needs zero JS edits. Behavioral
        // branches stay server-owned; the page only renders name/color/icon.
        const deviceVendors = {{ vendor_metadata | tojson }};

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('management-url').textContent = window.location.host;
            fetchDisplayConfig();
            fetch('/api/device-settings').then(r => r.json()).then(s => {
                if (s.tarana?.operator_id) window.defaultOperatorId = s.tarana.operator_id;
            }).catch(() => {});
            loadSetupReadiness();
            readinessRefreshTimer = setInterval(loadSetupReadiness, 60000);
            buildCards();
            updatePorts(INITIAL_PORTS || {});
            connectWebSocket();
            setInterval(checkStale, 2000);
            setInterval(updateClock, 1000);
            updateClock();
        });

        function updateClock() {
            const el = document.getElementById('clock');
            if (el) el.textContent = new Date().toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;',
            }[ch]));
        }

        function readinessBannerClasses(status) {
            if (status === 'ready') return 'bg-green-50 text-green-900';
            if (status === 'warning') return 'bg-yellow-50 text-yellow-900';
            if (status === 'missing' || status === 'error') return 'bg-red-50 text-red-900';
            return 'bg-gray-50 text-gray-900';
        }

        function readinessStatusLabel(status) {
            return (status || 'unknown').toUpperCase();
        }

        function isSetupReadinessDismissed() {
            try {
                return localStorage.getItem(SETUP_READINESS_DISMISSED_KEY) === 'true';
            } catch (error) {
                return false;
            }
        }

        function clearSetupReadinessDismissal() {
            try {
                localStorage.removeItem(SETUP_READINESS_DISMISSED_KEY);
            } catch (error) {
                // Storage can be unavailable in restricted browser contexts.
            }
        }

        function dismissSetupReadinessBanner() {
            try {
                localStorage.setItem(SETUP_READINESS_DISMISSED_KEY, 'true');
            } catch (error) {
                // The current page can still be dismissed if storage is unavailable.
            }
            const banner = document.getElementById('setup-readiness-banner');
            if (!banner) return;
            banner.className = 'hidden flex-shrink-0 px-4 py-3 border-b border-gray-300';
            banner.innerHTML = '';
        }

        async function loadSetupReadiness() {
            try {
                const response = await fetch('/api/setup/readiness');
                if (!response.ok) return;
                const data = await response.json();
                renderSetupReadinessBanner(data);
            } catch (error) {
                console.error('Failed to load setup readiness:', error);
            }
        }

        function renderSetupReadinessBanner(data) {
            const banner = document.getElementById('setup-readiness-banner');
            if (!banner) return;

            if (!data || data.status === 'ready') {
                if (data?.status === 'ready') clearSetupReadinessDismissal();
                banner.className = 'hidden flex-shrink-0 px-4 py-3 border-b border-gray-300';
                banner.innerHTML = '';
                return;
            }

            if (isSetupReadinessDismissed()) {
                banner.className = 'hidden flex-shrink-0 px-4 py-3 border-b border-gray-300';
                banner.innerHTML = '';
                return;
            }

            const counts = data.summary || {};
            const switchCheck = (data.checks || []).find(check => check.id === 'mikrotik_switch');
            const switchSummary = switchCheck ? switchCheck.summary : 'Switch status unavailable.';

            banner.className = `flex-shrink-0 px-4 py-3 border-b border-gray-300 ${readinessBannerClasses(data.status)}`;
            banner.innerHTML = `
                <div class="max-w-[1000px] mx-auto flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                    <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-3 mb-1">
                            <span class="text-xs font-bold tracking-wide">${readinessStatusLabel(data.status)}</span>
                            <span class="text-sm">${counts.warning || 0} warning</span>
                            <span class="text-sm">${counts.missing || 0} missing</span>
                            <span class="text-sm">${counts.error || 0} error</span>
                        </div>
                        <div class="text-sm font-semibold">Setup is not complete yet.</div>
                        <div class="text-sm opacity-80">${escapeHtml(switchSummary)}</div>
                    </div>
                    <div class="flex items-center gap-2 self-start sm:self-auto">
                        <a href="/files" class="px-4 py-2 rounded-lg bg-white/80 hover:bg-white text-sm font-semibold text-gray-900 border border-gray-300">
                            Open Setup
                        </a>
                        <button type="button" onclick="dismissSetupReadinessBanner()" class="w-12 h-12 flex items-center justify-center rounded-lg bg-white/50 hover:bg-white text-gray-700 border border-gray-300 text-xl" aria-label="Dismiss setup readiness notice" title="Dismiss setup readiness notice">
                            &times;
                        </button>
                    </div>
                </div>
            `;
        }

        // WebSocket

        function parseFirmwareBanks(raw) {
            const parts = {};
            if (!raw || typeof raw !== 'string') return parts;
            raw.split('|').forEach(p => {
                const idx = p.indexOf(':');
                if (idx > 0) {
                    const k = p.slice(0, idx);
                    const v = p.slice(idx + 1);
                    if (k && v) parts[k] = v;
                }
            });
            // Backward-compatible aliases for existing bank payloads.
            if (parts.bank1 && !parts.software) parts.software = parts.bank1;
            if (parts.bank2 && !parts.routerboard) parts.routerboard = parts.bank2;
            return parts;
        }

        function shortFw(v) {
            return (v || '').toString().trim().split(' ')[0];
        }

        function formatFromTo(fromValue, toValue) {
            const from = shortFw(fromValue);
            const to = shortFw(toValue);
            if (!from) return to;
            if (!to || from === to) return to || from;
            return `${from} -> ${to}`;
        }

        function firmwareValueForStep(parts, deviceType, stepKey) {
            if (stepKey === 'firmware_update_1') {
                return deviceType === 'mikrotik'
                    ? (parts.software || parts.bank1 || '')
                    : (parts.bank1 || '');
            }
            if (stepKey === 'firmware_update_2') {
                return deviceType === 'mikrotik'
                    ? (parts.routerboard || parts.bank2 || '')
                    : (parts.bank2 || '');
            }
            return '';
        }

        function firmwareStepLabel(deviceType, key) {
            if (deviceType === 'mikrotik') {
                if (key === 'firmware_update_1') return 'Software';
                if (key === 'firmware_update_2') return 'RouterBOARD';
            }
            return key === 'firmware_update_1' ? 'FW Bank 1' : 'FW Bank 2';
        }

        function firmwareBanksDetail(parts, deviceType) {
            if (deviceType === 'mikrotik') {
                const sw = (parts.software || '?').split(' ')[0];
                const rb = (parts.routerboard || '?').split(' ')[0];
                return `SW ${sw} / RB ${rb}`;
            }
            const v1 = (parts.bank1 || '?').split(' ')[0];
            const v2 = (parts.bank2 || '?').split(' ')[0];
            let detail = v1 === v2 ? v1 : `${v1} / ${v2}`;
            if (parts.active) detail += ` (bank ${parts.active})`;
            return detail;
        }


        // ================================================================
        // Live updates: WebSocket with unbounded backoff and a stale banner
        // ================================================================
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            try {
                ws = new WebSocket(`${protocol}//${window.location.host}/ws/status`);
            } catch (error) {
                scheduleReconnect();
                return;
            }
            ws.onopen = () => {
                reconnectAttempts = 0;
                lastMessageAt = Date.now();
                setLiveState('live');
                document.getElementById('status-text').textContent = 'Connected';
                if (selectedPort != null) fetchTimeline(selectedPort);
            };
            ws.onmessage = (event) => {
                lastMessageAt = Date.now();
                try { handleWebSocketMessage(JSON.parse(event.data)); } catch (error) { console.warn('bad message', error); }
            };
            ws.onclose = () => { setLiveState('down'); scheduleReconnect(); };
            ws.onerror = () => { try { ws.close(); } catch (e) {} };
        }

        function scheduleReconnect() {
            reconnectAttempts += 1;
            const delay = Math.min(1000 * Math.pow(2, Math.min(reconnectAttempts, 4)), 15000);
            document.getElementById('status-text').textContent = `Reconnecting (${reconnectAttempts})...`;
            setTimeout(connectWebSocket, delay);
        }
        window.addEventListener('online', () => { if (!ws || ws.readyState > 1) connectWebSocket(); });
        document.addEventListener('visibilitychange', () => { if (!document.hidden && (!ws || ws.readyState > 1)) connectWebSocket(); });

        function setLiveState(state) {
            const dot = document.getElementById('connection-indicator');
            dot.classList.toggle('stale', state === 'stale');
            dot.classList.toggle('down', state === 'down');
            document.getElementById('stale-banner').classList.toggle('hidden', state === 'live');
        }

        function checkStale() {
            if (!lastMessageAt) return;
            const age = Date.now() - lastMessageAt;
            if (age > 6000) {
                setLiveState(ws && ws.readyState === 1 ? 'stale' : 'down');
                document.getElementById('stale-banner').textContent = `Live updates paused. Last update ${Math.round(age / 1000)}s ago. Reconnecting...`;
            } else {
                setLiveState('live');
            }
        }

        function handleWebSocketMessage(message) {
            switch (message.type) {
                case 'initial_status':
                case 'status_update':
                    updatePorts(message.data?.ports || {});
                    break;
                case 'port_update':
                    updateSinglePort(message.port_number, message.data);
                    break;
                case 'port_event':
                    appendEvent(message.port_number, message.event);
                    break;
                case 'display_state':
                    handleDisplayStateMessage(message);
                    break;
                default:
                    break;
            }
        }

        function updatePorts(portsData) {
            for (const [key, value] of Object.entries(portsData)) {
                ports[key] = value;
                updatePortCard(parseInt(key));
            }
            refreshOpenModal();
            checkIdleState();
        }

        function updateSinglePort(portNumber, data) {
            ports[portNumber] = { ...(ports[portNumber] || {}), ...data };
            updatePortCard(portNumber);
            refreshOpenModal();
            checkIdleState();
        }

        // ================================================================
        // Presentation: server-owned phase/tone/headline, with a fallback
        // ================================================================
        function presentationForPort(port) {
            if (port && port.presentation && port.presentation.phase) return port.presentation;
            // Fallback for a server that predates the presentation contract.
            if (!port) return { phase: 'idle', tone: 'idle', icon: 'dash', headline: 'NO LINK', detail: null, progress: null, mode_chip: null };
            if (port.waiting_for_boot) return { phase: 'booting', tone: 'active', icon: 'spinner', headline: 'BOOTING', detail: null, progress: null, mode_chip: null };
            if (port.provisioning) return { phase: 'running', tone: 'active', icon: 'spinner', headline: 'PROVISIONING', detail: null, progress: null, mode_chip: null };
            if (port.last_result === 'success' || port.last_result === 'complete') return { phase: 'complete', tone: 'success', icon: 'check', headline: 'COMPLETE', detail: null, progress: null, mode_chip: null };
            if (port.last_result === 'failed') return { phase: 'failed', tone: 'error', icon: 'x', headline: 'FAILED', detail: port.last_error, progress: null, mode_chip: null };
            if (!port.link_up) return { phase: 'no_link', tone: 'idle', icon: 'dash', headline: 'NO LINK', detail: null, progress: null, mode_chip: null };
            if (port.device_detected) return { phase: 'detected', tone: 'active', icon: 'spinner', headline: 'DETECTED', detail: null, progress: null, mode_chip: null };
            return { phase: 'idle', tone: 'idle', icon: 'dash', headline: 'NO LINK', detail: null, progress: null, mode_chip: null };
        }

        function statusIconSVG(type) {
            const svgs = {
                check: '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>',
                x: '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>',
                alert: '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M4.9 19h14.2c1.5 0 2.5-1.7 1.7-3L13.7 4a2 2 0 00-3.4 0L3.2 16c-.8 1.3.2 3 1.7 3z"/></svg>',
                spinner: '<svg class="spin" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 3a9 9 0 019 9"/></svg>',
                dash: '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" d="M5 12h14"/></svg>',
            };
            return svgs[type] || svgs.dash;
        }

        function formatSpeed(speed) {
            if (!speed) return '';
            return String(speed).replace('bps', '').replace('1G', '1G').replace('100M', '100M');
        }

        // ================================================================
        // Cards: built once, patched by signature (no full re-render)
        // ================================================================
        function cardOrder() {
            const top = [], bottom = [];
            for (let n = 1; n <= NUM_PORTS; n++) (n % 2 === 0 ? top : bottom).push(n);
            if (NUM_PORTS === 1) return { top: [], bottom: [1] };
            return { top, bottom };
        }

        function buildCards() {
            const order = cardOrder();
            const make = (n) => `
                <article class="port-card" id="port-card-${n}" data-port="${n}" data-tone="idle" data-clickable="false" onclick="onCardTap(${n})">
                    <div class="card-rail"></div>
                    <div class="card-identity" id="card-identity-${n}"></div>
                    <div class="card-status tone-idle" id="card-status-${n}"></div>
                    <div class="card-footer" id="card-footer-${n}"></div>
                </article>`;
            document.getElementById('port-row-top').innerHTML = order.top.map(make).join('');
            document.getElementById('port-row-bottom').innerHTML = order.bottom.map(make).join('');
            for (let n = 1; n <= NUM_PORTS; n++) updatePortCard(n);
        }

        function vendorPill(port) {
            const vendor = deviceVendors[port?.device_type] || deviceVendors.unknown;
            const icon = vendor.icon ? `<img src="${vendor.icon}" alt="">` : '';
            return `<span class="vendor-pill" style="--vendor-color:${vendor.color}">${icon}${escapeHtml(vendor.name)}</span>`;
        }

        function updatePortCard(n) {
            const port = ports[n] || ports[String(n)];
            const card = document.getElementById(`port-card-${n}`);
            if (!card) return;
            const p = presentationForPort(port);
            const sig = JSON.stringify([p, port?.device_type, port?.device_model, port?.link_speed, port?.device_mode, port?.device_detected, port?.link_up]);
            if (lastCardSig[n] === sig) return;
            lastCardSig[n] = sig;

            const clickable = Boolean(port && (port.device_detected || port.last_result || port.link_up));
            card.dataset.tone = p.tone;
            card.dataset.clickable = clickable ? 'true' : 'false';

            const identity = document.getElementById(`card-identity-${n}`);
            if (port && port.device_detected) {
                identity.innerHTML = `${vendorPill(port)}<span class="card-model truncate">${escapeHtml(port.device_model || '')}</span><span class="ml-auto port-badge">P${n}</span>${port.link_speed ? `<span class="mono">${escapeHtml(formatSpeed(port.link_speed))}</span>` : ''}`;
            } else {
                identity.innerHTML = `<span style="color: var(--fg-dim)">Port ${n}</span><span class="ml-auto port-badge">P${n}</span>`;
            }

            const status = document.getElementById(`card-status-${n}`);
            status.className = `card-status tone-${p.tone}`;
            const bar = p.progress && p.progress.total ? `<div class="progress-track"><div class="progress-fill" style="width:${Math.round(100 * p.progress.done / p.progress.total)}%"></div></div>` : '';
            status.innerHTML = `<div class="status-icon">${statusIconSVG(p.icon)}</div><div class="status-headline">${escapeHtml(p.headline)}</div>${p.detail ? `<div class="status-detail">${escapeHtml(p.detail)}</div>` : ''}${bar}`;

            const footer = document.getElementById(`card-footer-${n}`);
            if (p.mode_chip && p.mode_chip.mode) {
                footer.innerHTML = `<span class="mode-chip">${escapeHtml(p.mode_chip.mode.toUpperCase())}${p.mode_chip.hostname ? ' ' + escapeHtml(p.mode_chip.hostname) : ''}</span><span>Tap for details</span>`;
            } else if (p.phase === 'complete') {
                footer.innerHTML = `<span class="mode-chip">SM VERIFIED</span><span>Tap for details</span>`;
            } else if (p.reset_hint) {
                footer.innerHTML = `<span style="color: var(--tone-warning)">May need factory reset</span><span>Tap for details</span>`;
            } else {
                footer.innerHTML = `<span>${clickable ? 'Tap for details' : ''}</span><span class="mono">${port?.device_ip ? escapeHtml(port.device_ip) : ''}</span>`;
            }
        }

        function onCardTap(n) {
            const port = ports[n] || ports[String(n)];
            if (!port) return;
            if (!(port.device_detected || port.last_result || port.link_up)) return;
            openPortModal(n);
        }

        // ================================================================
        // Port sheet: summary / notice / timeline / actions regions
        // ================================================================
        function region(id) { return document.getElementById(id); }

        function setPortModalFooter(html) { region('modal-footer').innerHTML = html; }

        function openPortModal(portNum) {
            selectedPort = portNum;
            modalView = { port: portNum, view: 'details' };
            lastModalSig = {};
            document.getElementById('port-modal').classList.remove('hidden');
            renderPortModal(true);
            fetchTimeline(portNum);
        }

        function refreshOpenModal() {
            if (selectedPort == null || !modalView) return;
            if (modalView.view === 'details') renderPortModal(false);
            if (modalView.view === 'mode-progress') renderModeProgress();
        }

        function workflowForPort(port) {
            if (port && port.workflow && Array.isArray(port.workflow.available_actions)) return port.workflow;
            return { state: 'idle', required_action: null, baseline_mode: null, available_actions: [], service_actions: [], unqualified: {}, transitions: {} };
        }

        function renderPortModal(force) {
            const port = ports[selectedPort] || ports[String(selectedPort)];
            if (!port) return;
            const p = presentationForPort(port);
            const workflow = workflowForPort(port);
            document.getElementById('modal-title').textContent = `Port ${selectedPort}`;

            const summarySig = JSON.stringify([port.device_type, port.device_model, port.device_mac, port.device_serial, port.device_ip, port.firmware_version, port.link_speed, port.device_mode, port.mode_config]);
            if (force || lastModalSig.summary !== summarySig) {
                lastModalSig.summary = summarySig;
                const fw = parseFirmwareBanks(port.firmware_version);
                const fwDetail = port.firmware_version ? firmwareBanksDetail(fw, port.device_type) : '';
                region('modal-summary').innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <div class="text-lg font-extrabold">${vendorPill(port)} <span style="color: var(--fg)">${escapeHtml(port.device_model || '')}</span></div>
                        ${p.mode_chip && p.mode_chip.mode ? `<span class="mode-chip">${escapeHtml(p.mode_chip.mode.toUpperCase())}</span>` : ''}
                    </div>
                    <div class="summary-grid">
                        <span class="k">MAC</span><span class="v">${escapeHtml(port.device_mac || '-')}</span>
                        <span class="k">Serial</span><span class="v">${escapeHtml(port.device_serial || '-')}</span>
                        <span class="k">IP</span><span class="v">${escapeHtml(port.device_ip || '-')}</span>
                        <span class="k">Link</span><span class="v">${escapeHtml(port.link_up ? (formatSpeed(port.link_speed) || 'up') : 'down')}</span>
                        <span class="k">Firmware</span><span class="v">${escapeHtml(fwDetail || port.firmware_version || '-')}</span>
                        ${p.mode_chip?.hostname ? `<span class="k">Hostname</span><span class="v">${escapeHtml(p.mode_chip.hostname)}</span>` : ''}
                        ${p.mode_chip?.link_id ? `<span class="k">Link</span><span class="v">${escapeHtml(p.mode_chip.link_id)}</span>` : ''}
                    </div>`;
            }

            const noticeSig = JSON.stringify([p.phase, p.headline, p.detail, port.last_error, workflow.state, workflow.required_action]);
            if (force || lastModalSig.notice !== noticeSig) {
                lastModalSig.notice = noticeSig;
                renderStatusNotice(port, p, workflow);
            }

            const actionsSig = JSON.stringify([workflow, p.phase]);
            if (force || lastModalSig.actions !== actionsSig) {
                lastModalSig.actions = actionsSig;
                region('modal-actions').innerHTML = renderWorkflowActionPanel(selectedPort, port);
                renderPortModalFooter(selectedPort, port);
            }
            renderTimeline(selectedPort);
        }

        function noticeHtml({ tone, title, body, actions }) {
            const icon = { error: 'x', warning: 'alert', success: 'check', active: 'spinner', idle: 'dash' }[tone] || 'dash';
            const btns = (actions || []).map(a => `<button class="modal-action ${a.cls || 'modal-action-secondary'}" onclick="${a.onclick}">${escapeHtml(a.label)}</button>`).join('');
            return `<div class="notice tone-${tone}"><div class="notice-title"><span style="width:20px;height:20px;display:inline-flex">${statusIconSVG(icon)}</span>${escapeHtml(title)}</div>${body ? `<div>${body}</div>` : ''}${btns ? `<div class="notice-actions">${btns}</div>` : ''}</div>`;
        }

        function showModalNotice(notice) { region('modal-notice').innerHTML = noticeHtml(notice); }

        function renderStatusNotice(port, p, workflow) {
            if (p.phase === 'failed') {
                showModalNotice({ tone: 'error', title: 'Provisioning failed', body: escapeHtml(port.last_error || p.detail || 'See the timeline below.') });
            } else if (p.phase === 'needs_credentials') {
                showModalNotice({ tone: 'warning', title: 'Credentials required', body: escapeHtml(port.last_error || 'The device rejected the default login.') });
            } else if (p.phase === 'config_required') {
                showModalNotice({ tone: 'warning', title: `${(workflow.baseline_mode || 'standard').toUpperCase()} config missing`, body: 'Cannot deploy. Provisioning finished without the standard configuration.' });
            } else if (p.phase === 'config_unverified') {
                showModalNotice({ tone: 'warning', title: `${(workflow.baseline_mode || 'standard').toUpperCase()} config unverified`, body: 'The configuration was applied but could not be read back. Re-run provisioning before deploying.' });
            } else if (p.phase === 'action_required') {
                showModalNotice({ tone: 'warning', title: 'Choose a deployment mode', body: 'This job requires an explicit AP or PTP selection.' });
            } else if (p.phase === 'booting') {
                showModalNotice({ tone: 'active', title: 'Waiting for the device to boot', body: p.reset_hint ? 'No response for a long time. Hold the reset button for 10 seconds if the device is stuck.' : 'Checking connected device...' });
            } else if (p.phase === 'running' || p.phase === 'mode_changing') {
                showModalNotice({ tone: 'active', title: p.headline, body: escapeHtml(p.detail || '') });
            } else if (p.phase === 'complete') {
                showModalNotice({ tone: 'success', title: 'Standard SM configuration verified', body: 'Ready to deploy. Elevate to AP or PTP only through a qualified action below.' });
            } else if (p.phase === 'deployed') {
                showModalNotice({ tone: 'success', title: `Deployed as ${(p.mode_chip?.mode || '').toUpperCase()}`, body: 'Restore the standard SM configuration to return this radio to the baseline.' });
            } else if (p.phase === 'no_link') {
                showModalNotice({ tone: 'idle', title: 'Waiting for link...', body: '' });
            } else {
                region('modal-notice').innerHTML = '';
            }
        }

        // Timeline: server-owned events (survive reload and Chromium respawn)
        async function fetchTimeline(portNum) {
            const cache = timelines[portNum] || { latest_seq: 0, events: [] };
            try {
                const response = await fetch(`/api/ports/${portNum}/events?since=${cache.latest_seq}`);
                if (!response.ok) return;
                const data = await response.json();
                cache.events = cache.events.concat(data.events || []).slice(-200);
                cache.latest_seq = data.latest_seq || cache.latest_seq;
                timelines[portNum] = cache;
                if (selectedPort === portNum) renderTimeline(portNum);
            } catch (error) { /* offline: keep what we have */ }
        }

        function appendEvent(portNum, event) {
            const cache = timelines[portNum] || (timelines[portNum] = { latest_seq: 0, events: [] });
            if (event.seq <= cache.latest_seq) return;
            if (event.seq !== cache.latest_seq + 1 && cache.latest_seq) { fetchTimeline(portNum); return; }
            cache.events.push(event);
            cache.events = cache.events.slice(-200);
            cache.latest_seq = event.seq;
            if (selectedPort === portNum && modalView?.view === 'details') renderTimeline(portNum);
        }

        function eventGlyph(event) {
            const s = event.status;
            if (s === true || s === 'success') return ['✓', 'var(--tone-success)'];
            if (s === false || s === 'failed') return ['✗', 'var(--tone-error)'];
            if (s === 'loading') return ['●', 'var(--tone-active)'];
            if (s === 'unverified') return ['!', 'var(--tone-warning)'];
            if (s === 'skipped') return ['—', 'var(--fg-dim)'];
            if (event.kind === 'link_down' || event.kind === 'device_lost') return ['○', 'var(--fg-dim)'];
            return ['○', 'var(--fg-dim)'];
        }

        function eventTime(ts) {
            const d = new Date(ts * 1000);
            return d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }).slice(0, 8);
        }

        function renderTimeline(portNum) {
            const box = region('modal-timeline');
            const cache = timelines[portNum];
            const events = cache ? cache.events : [];
            const port = ports[portNum] || ports[String(portNum)] || {};
            const runId = port.mode_job?.id || port.run_id;
            const shown = runId ? events.filter(e => !e.run_id || e.run_id === runId || ['link_up', 'link_down', 'device_detected', 'credentials_required'].includes(e.kind)) : events;
            const list = shown.slice(-40);
            const sig = JSON.stringify(list.map(e => e.seq));
            if (lastModalSig.timeline === sig) return;
            lastModalSig.timeline = sig;
            const scroller = box.querySelector('.timeline');
            const atBottom = !scroller || (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 24);
            box.innerHTML = `<div class="section-title">Timeline</div><div class="timeline">${
                list.length ? list.map(e => {
                    const [glyph, color] = eventGlyph(e);
                    return `<div class="timeline-row"><span class="timeline-time">${eventTime(e.ts)}</span><span class="timeline-glyph" style="color:${color}">${glyph}</span><span><div class="timeline-label">${escapeHtml(e.label || e.kind)}</div>${e.detail ? `<div class="timeline-detail">${escapeHtml(e.detail)}</div>` : ''}</span></div>`;
                }).join('') : `<div class="timeline-row"><span class="timeline-time">--:--:--</span><span class="timeline-glyph" style="color: var(--fg-dim)">○</span><span class="timeline-label" style="color: var(--fg-muted)">No activity yet</span></div>`
            }</div>`;
            const next = box.querySelector('.timeline');
            if (next && atBottom) next.scrollTop = next.scrollHeight;
        }

        // Actions: rendered from the server-owned workflow contract only
        function actionLabel(action) { return action.label || action.id; }

        function runPortWorkflowAction(actionId, portNum) {
            if (actionId === 'retry_credentials') return openCredentialModal(portNum);
            if (actionId === 'retry_provisioning') return openProvisionModal(portNum);
            if (actionId === 'configure_sm') return openModeChange(portNum, 'sm');
            if (actionId === 'configure_ap') return openModeChange(portNum, 'ap');
            if (actionId === 'configure_ptp') return openModeChange(portNum, 'ptp');
            if (actionId === 'manual_netinstall') return confirmNetinstall(portNum);
            showToast(`Unknown action ${actionId}`, 'error');
        }

        function renderWorkflowActionButton(action, portNum) {
            return `<button onclick="runPortWorkflowAction('${action.id}', ${portNum})" class="modal-action modal-action-primary w-full">${escapeHtml(actionLabel(action))}</button>`;
        }

        function renderWorkflowActionPanel(portNum, port) {
            const workflow = workflowForPort(port);
            const active = workflow.state === 'running';
            let html = '';
            const modeActions = workflow.available_actions.filter(a => a.id.startsWith('configure_'));
            const unqualified = workflow.unqualified || {};
            if (!active && (modeActions.length || Object.keys(unqualified).length)) {
                const required = workflow.state === 'action_required';
                const restore = modeActions.some(a => a.id === 'configure_sm');
                html += `<div class="section-title">${required ? 'Next step' : restore ? 'Restore standard SM config' : 'Deployment options'}</div>`;
                html += `<div class="workflow-actions-grid ${modeActions.length === 1 ? 'single' : ''}">${modeActions.map(a => renderWorkflowActionButton(a, portNum)).join('')}</div>`;
                const reasons = Object.entries(unqualified);
                if (reasons.length) {
                    html += `<div class="mt-2 space-y-1">${reasons.map(([mode, reason]) => `<div class="transition-row disabled"><span class="font-bold">${escapeHtml(mode.toUpperCase())}</span><span class="transition-reason">${escapeHtml(reason)}</span></div>`).join('')}</div>`;
                }
            }
            if (!active && workflow.service_actions && workflow.service_actions.length) {
                html += `<details class="service-actions mt-3"><summary>Service actions</summary><div class="space-y-2 mt-2">${workflow.service_actions.map(a => `<button class="service-action-button" onclick="runPortWorkflowAction('${a.id}', ${portNum})">${escapeHtml(actionLabel(a))}</button>`).join('')}</div></details>`;
            }
            return html;
        }

        function renderPortModalFooter(portNum, port) {
            const workflow = workflowForPort(port);
            const active = workflow.state === 'running';
            let html = '';
            if (active) {
                html = `<button onclick="closeModal()" class="modal-action modal-action-secondary">Close</button>`;
            } else {
                const retry = workflow.available_actions.find(a => a.id === 'retry_credentials' || a.id === 'retry_provisioning');
                if (retry) {
                    html += `<button onclick="runPortWorkflowAction('${retry.id}', ${portNum})" class="modal-action ${retry.id === 'retry_credentials' ? 'modal-action-warning' : 'modal-action-primary'}">${escapeHtml(retry.id === 'retry_credentials' ? 'Enter credentials and retry' : 'Retry provisioning')}</button>`;
                } else if (port.workflow && port.workflow.state !== 'failed' && port.device_detected && !port.last_result && !port.provisioning && !port.waiting_for_boot) {
                    html += `<button onclick="openProvisionModal(${portNum})" class="modal-action modal-action-primary">Provision</button>`;
                }
                html += `<button onclick="closeModal()" class="modal-action modal-action-secondary">Done</button>`;
            }
            setPortModalFooter(html);
        }

        function confirmNetinstall(portNum) {
            showModalNotice({
                tone: 'warning',
                title: `Start Netinstall on port ${portNum}?`,
                body: 'The device must be in BOOTP mode (reset button held during power-on).',
                actions: [
                    { label: 'Start Netinstall', cls: 'modal-action-warning', onclick: `startNetinstall(${portNum})` },
                    { label: 'Back', onclick: `renderPortModal(true)` },
                ],
            });
        }

        // ================================================================
        // Unified mode change: choose -> parameters -> confirm -> progress
        // ================================================================
        const DIRECTIONS = ['north', 'east', 'south', 'west'];

        function openModeChange(portNum, targetMode) {
            selectedPort = portNum;
            modalView = { port: portNum, view: 'mode-params', mode: targetMode, tower: null, direction: null, my_tower: null, remote_tower: null, preview: null };
            document.getElementById('port-modal').classList.remove('hidden');
            region('modal-timeline').innerHTML = '';
            region('modal-notice').innerHTML = '';
            renderModeParams();
        }

        function modeTitle(mode) { return { sm: 'Restore SM Config', ap: 'Set up AP', ptp: 'Set up PTP link' }[mode] || mode; }

        function renderModeParams() {
            const v = modalView;
            document.getElementById('modal-title').textContent = `${modeTitle(v.mode)} - Port ${v.port}`;
            region('modal-summary').innerHTML = '';
            let html = '';
            if (v.mode === 'ap') {
                html += `<div class="section-title">Tower number (1-99)</div><input type="number" min="1" max="99" class="field mono mb-3" id="mode-tower" value="${v.tower || ''}" oninput="onModeInput()" placeholder="Tower">`;
                html += `<div class="section-title">Direction</div><div class="grid grid-cols-4 gap-2 mb-3" id="ap-direction-btns">${DIRECTIONS.map(d => `<button class="choice-btn ${v.direction === d ? 'selected' : ''}" onclick="selectDirection('${d}')">${d.charAt(0).toUpperCase() + d.slice(1)}</button>`).join('')}</div>`;
            } else if (v.mode === 'ptp') {
                html += `<div class="grid grid-cols-2 gap-3 mb-3"><div><div class="section-title">This tower</div><input type="number" min="1" max="99" class="field mono" id="mode-my-tower" value="${v.my_tower || ''}" oninput="onModeInput()" placeholder="Tower"></div><div><div class="section-title">Remote tower</div><input type="number" min="1" max="99" class="field mono" id="mode-remote-tower" value="${v.remote_tower || ''}" oninput="onModeInput()" placeholder="Tower"></div></div>`;
            }
            html += `<div id="mode-preview"></div>`;
            region('modal-actions').innerHTML = html;
            setPortModalFooter(`<button id="mode-continue" class="modal-action modal-action-primary" onclick="renderModeConfirm()" disabled>Continue</button><button onclick="openPortModal(${v.port})" class="modal-action modal-action-secondary">Back</button>`);
            if (v.mode === 'sm') requestPreview();
        }

        function selectDirection(dir) { modalView.direction = dir; renderModeParams(); requestPreview(); }

        function onModeInput() {
            const v = modalView;
            if (v.mode === 'ap') v.tower = parseInt(document.getElementById('mode-tower')?.value) || null;
            if (v.mode === 'ptp') {
                v.my_tower = parseInt(document.getElementById('mode-my-tower')?.value) || null;
                v.remote_tower = parseInt(document.getElementById('mode-remote-tower')?.value) || null;
            }
            requestPreview();
        }

        function modeRequestBody() {
            const v = modalView;
            const body = { mode: v.mode };
            if (v.mode === 'ap') { body.tower = v.tower; body.direction = v.direction; }
            if (v.mode === 'ptp') { body.my_tower = v.my_tower; body.remote_tower = v.remote_tower; }
            return body;
        }

        function modeParamsComplete() {
            const v = modalView;
            if (v.mode === 'ap') return Boolean(v.tower && v.direction);
            if (v.mode === 'ptp') return Boolean(v.my_tower && v.remote_tower && v.my_tower !== v.remote_tower);
            return true;
        }

        function requestPreview() {
            clearTimeout(previewTimer);
            const box = document.getElementById('mode-preview');
            const btn = document.getElementById('mode-continue');
            if (!modeParamsComplete()) { if (box) box.innerHTML = ''; if (btn) btn.disabled = true; modalView.preview = null; return; }
            previewTimer = setTimeout(async () => {
                const v = modalView;
                try {
                    const response = await fetch(`/api/ports/${v.port}/mode-preview`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(modeRequestBody()) });
                    const data = await response.json();
                    if (!response.ok) {
                        v.preview = null;
                        if (box) box.innerHTML = noticeHtml({ tone: 'error', title: 'Not available', body: escapeHtml(data.detail || 'Preview failed') });
                        if (btn) btn.disabled = true;
                        return;
                    }
                    v.preview = data;
                    if (box) box.innerHTML = renderPreview(data);
                    if (btn) btn.disabled = false;
                } catch (error) {
                    if (box) box.innerHTML = noticeHtml({ tone: 'error', title: 'Preview failed', body: 'Could not reach the provisioner.' });
                    if (btn) btn.disabled = true;
                }
            }, 300);
        }

        function renderPreview(data) {
            const rows = (data.changes || []).map(c => `<div class="compare"><div class="cell"><div class="k">${escapeHtml(c.field)}</div><div class="v">${escapeHtml(String(c.from ?? '-'))}</div></div><div style="color: var(--fg-dim)">→</div><div class="cell"><div class="k">${escapeHtml(c.field)}</div><div class="v">${escapeHtml(String(c.to ?? '-'))}</div></div></div>`).join('');
            const ptp = data.ptp_side ? `<div class="summary-grid mt-2"><span class="k">Link</span><span class="v">${escapeHtml(data.ptp_link_id || '')}</span><span class="k">Side</span><span class="v">${escapeHtml(String(data.ptp_side).toUpperCase())}</span>${data.peer ? `<span class="k">Peer</span><span class="v">Port ${escapeHtml(String(data.peer.port))} ${escapeHtml(data.peer.device_model || '')}</span>` : ''}</div>` : '';
            const tpl = `<div class="summary-grid mt-2"><span class="k">Profile</span><span class="v">${escapeHtml(data.template_label || '-')}${data.template_found ? '' : ' (naming only)'}</span></div>`;
            const warn = (data.warnings || []).map(w => noticeHtml({ tone: 'warning', title: w })).join('');
            return `<div class="section-title">This change will set</div><div class="space-y-2">${rows}</div>${ptp}${tpl}<div class="mt-2">${warn}</div>`;
        }

        function renderModeConfirm() {
            const v = modalView;
            if (!v.preview) return;
            v.view = 'mode-confirm';
            document.getElementById('modal-title').textContent = `Confirm: ${modeTitle(v.mode)}`;
            region('modal-actions').innerHTML = `<div class="compare mb-3"><div class="cell"><div class="k">Current mode</div><div class="v">${escapeHtml(String(v.preview.current_mode || 'sm').toUpperCase())}</div></div><div style="color: var(--fg-dim)">→</div><div class="cell"><div class="k">Target mode</div><div class="v">${escapeHtml(String(v.preview.target_mode === 'ptp' ? 'ptp-' + v.preview.ptp_side : v.preview.target_mode).toUpperCase())}</div></div></div>${renderPreview(v.preview)}`;
            const label = v.mode === 'sm' ? 'Restore SM Config' : v.mode === 'ptp' ? `Apply PTP side ${String(v.preview.ptp_side || '').toUpperCase()}` : 'Apply AP config';
            setPortModalFooter(`<button class="modal-action ${v.mode === 'sm' ? 'modal-action-warning' : 'modal-action-primary'}" onclick="applyModeChange()">${escapeHtml(label)}</button><button onclick="renderModeParamsBack()" class="modal-action modal-action-secondary">Back</button>`);
        }

        function renderModeParamsBack() { modalView.view = 'mode-params'; renderModeParams(); requestPreview(); }

        async function applyModeChange() {
            const v = modalView;
            try {
                const response = await fetch(`/api/ports/${v.port}/apply-mode`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(modeRequestBody()) });
                const data = await response.json();
                if (!response.ok) {
                    showModalNotice({ tone: 'error', title: 'Could not start', body: escapeHtml(data.detail || 'The request was refused.') });
                    return;
                }
                v.view = 'mode-progress';
                v.job_id = data.job_id;
                lastModalSig = {};
                renderModeProgress();
                fetchTimeline(v.port);
            } catch (error) {
                showModalNotice({ tone: 'error', title: 'Could not start', body: 'Could not reach the provisioner.' });
            }
        }

        function renderModeProgress() {
            const v = modalView;
            const port = ports[v.port] || ports[String(v.port)] || {};
            const job = port.mode_job;
            document.getElementById('modal-title').textContent = `${modeTitle(v.mode)} - Port ${v.port}`;
            region('modal-summary').innerHTML = '';
            region('modal-actions').innerHTML = '';
            if (job) {
                const steps = (job.steps || []).map(s => {
                    const st = (job.status || {})[s.key];
                    const [glyph, color] = eventGlyph({ status: st === undefined ? null : st });
                    return `<div class="timeline-row"><span class="timeline-time"></span><span class="timeline-glyph" style="color:${color}">${glyph}</span><span class="timeline-label">${escapeHtml(s.label)}</span></div>`;
                }).join('');
                showModalNotice({ tone: 'active', title: `Applying ${String(job.mode || v.mode).toUpperCase()}`, body: `<div class="timeline mt-2">${steps}</div>` });
                setPortModalFooter(`<button onclick="closeModal()" class="modal-action modal-action-secondary">Close</button>`);
                return;
            }
            // Job finished: read the outcome from the last timeline event.
            const events = (timelines[v.port]?.events || []).filter(e => e.run_id === v.job_id);
            const last = events[events.length - 1];
            if (last && last.kind === 'mode_change_applied') {
                showModalNotice({ tone: 'success', title: 'Mode change applied', body: escapeHtml(last.detail || '') });
            } else if (last && last.kind === 'mode_change_failed') {
                const failedStep = events.filter(e => e.kind === 'step_finished' && e.status === false).pop();
                showModalNotice({ tone: 'error', title: 'Mode change failed', body: escapeHtml((failedStep ? failedStep.label + ': ' : '') + (last.detail || '')), actions: [{ label: 'Try again', cls: 'modal-action-primary', onclick: 'renderModeParamsBack()' }] });
            } else {
                showModalNotice({ tone: 'active', title: 'Starting...', body: '' });
                setPortModalFooter(`<button onclick="closeModal()" class="modal-action modal-action-secondary">Close</button>`);
                return;
            }
            renderTimeline(v.port);
            setPortModalFooter(`<button onclick="openPortModal(${v.port})" class="modal-action modal-action-primary">Done</button>`);
        }

        function openProvisionModal(portNum) {
            selectedPort = portNum;
            const port = ports[portNum];
            const vendor = deviceVendors[port.device_type] || deviceVendors.unknown;

            document.getElementById('modal-title').textContent = `Provision Port ${portNum}`;
            document.getElementById('modal-content').innerHTML = `
                <div class="space-y-4">
                    <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                        <div class="font-bold text-lg flex items-center gap-2" style="color: ${vendor.color}">${vendor.icon ? `<img src="${vendor.icon}" class="w-5 h-5 rounded object-contain" alt="">` : ''}<span>${vendor.name}</span></div>
                        <div class="text-sm text-gray-600">${port.device_ip || 'Unknown IP'}</div>
                    </div>

                    <div>
                        <div class="text-sm font-medium text-gray-600 mb-2">Options</div>
                        <div class="space-y-2">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="checkbox" id="skip-config" class="w-5 h-5 rounded bg-white border-gray-300">
                                <span class="text-sm text-gray-900">Skip configuration</span>
                            </label>
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="checkbox" id="skip-firmware" class="w-5 h-5 rounded bg-white border-gray-300">
                                <span class="text-sm text-gray-900">Skip firmware update</span>
                            </label>
                        </div>
                    </div>

                    ${port.device_type === 'tarana' ? `
                    <div>
                        <div class="text-sm font-medium text-gray-600 mb-2">Operator ID</div>
                        <input type="number" id="operator-id" placeholder="Operator ID" value="${window.defaultOperatorId || ''}"
                            class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900">
                    </div>
                    ` : ''}

                    <div>
                        <div class="text-sm font-medium text-gray-600 mb-2">Custom Credentials (optional)</div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="custom-username" placeholder="Username"
                                class="bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900">
                            <input type="password" id="custom-password" placeholder="Password"
                                class="bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900">
                        </div>
                    </div>
                </div>
            `;
            setPortModalFooter(`
                <button onclick="startProvisioning(${portNum})" class="modal-action modal-action-primary">
                    Start Provisioning
                </button>
                <button onclick="closeModal()" class="modal-action modal-action-secondary">
                    Cancel
                </button>
            `);
            document.getElementById('port-modal').classList.remove('hidden');
        }

        // ================================================================
        // SM / AP / PTP Mode Modals

        function openCredentialModal(portNum) {
            selectedPort = portNum;
            const port = ports[portNum];
            const vendor = deviceVendors[port.device_type] || deviceVendors.unknown;

            document.getElementById('modal-title').textContent = `Credentials Required - Port ${portNum}`;
            document.getElementById('modal-content').innerHTML = `
                <div class="space-y-4">
                    <div class="p-3 bg-red-50 border border-red-300 rounded-lg">
                        <div class="flex items-center gap-2 text-red-700 font-medium mb-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                            </svg>
                            Authentication Failed
                        </div>
                        <div class="text-sm text-red-700">${port.last_error || 'Default credentials were rejected. Please enter the correct credentials.'}</div>
                    </div>

                    ${port.device_type !== 'tarana' ? `
                    <div class="p-3 bg-amber-50 border border-amber-300 rounded-lg">
                        <div class="flex items-center gap-2 text-amber-700 font-medium mb-1">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            Equipment may need factory reset
                        </div>
                        <div class="text-sm text-amber-700">Press and hold the reset button for 10 seconds, then try again.</div>
                    </div>
                    ` : ''}

                    <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                        <div class="font-bold text-lg flex items-center gap-2" style="color: ${vendor.color}">${vendor.icon ? `<img src="${vendor.icon}" class="w-5 h-5 rounded object-contain" alt="">` : ''}<span>${vendor.name}</span></div>
                        <div class="text-sm text-gray-600">${port.device_ip || 'Unknown IP'}</div>
                    </div>

                    <div>
                        <div class="text-sm font-medium text-gray-600 mb-2">Enter Device Credentials</div>
                        <div class="space-y-2">
                            <input type="text" id="custom-username" placeholder="Username" value="${vendor.defaultUser || 'admin'}"
                                class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900">
                            <input type="password" id="custom-password" placeholder="Password"
                                class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900" autofocus>
                            <label class="flex items-center gap-2 text-xs text-gray-600">
                                <input type="checkbox" id="save-credential-default" checked>
                                Save this credential for future ${vendor.name} devices
                            </label>
                        </div>
                    </div>
                </div>
            `;
            setPortModalFooter(`
                <button onclick="retryWithCredentials(${portNum})" class="modal-action modal-action-primary">
                    Retry with Credentials
                </button>
                <button onclick="closeModal()" class="modal-action modal-action-secondary">
                    Cancel
                </button>
            `);
            document.getElementById('port-modal').classList.remove('hidden');
            // Focus password field after modal opens
            setTimeout(() => document.getElementById('custom-password')?.focus(), 100);
        }

        async function retryWithCredentials(portNum) {
            const username = document.getElementById('custom-username')?.value;
