name: checks

on:
  push:
  pull_request:
    branches: [main]

# Static gates that catch the regression classes we keep hitting, separate from
# the pytest job in test.yml so each shows up as its own required status check.
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Documentation validation gate
        run: python scripts/check_docs.py

  py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Python 3.9 compatibility gate
        run: python scripts/check_py39.py

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Install project dependencies
        run: pip install -e ".[dev,web,snmp]"
      - name: Config template validation gate
        run: python scripts/check_templates.py

  bench-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Install project dependencies
        run: pip install -e ".[dev,web,snmp]"
      - name: Committed bench evidence validation gate
        run: python scripts/check_bench_evidence.py --all --repo-only
