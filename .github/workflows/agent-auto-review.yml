name: Auto-review PRs from trusted authors

# Auto-labels a new PR `agent:review` so the timer-driven Codex review loop on
# llm01 picks it up — but ONLY when the author is the repo owner, an org member,
# or an invited collaborator. PRs from anyone else are never labeled, so they
# never enter the autonomous pipeline (no review, no fix loop, nothing).
#
# Safe use of pull_request_target: this workflow NEVER checks out or runs PR
# code. It only reads the event payload and sets a label; the review itself runs
# on the timer-driven loop, not here. See docs/security-model.md § 9.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write   # create the agent:review label if a freshly onboarded repo hasn't seeded it

jobs:
  label:
    # Trusted authors only: OWNER (repo owner), MEMBER (org member),
    # COLLABORATOR (invited). CONTRIBUTOR / NONE / etc. are deliberately excluded.
    if: >
      github.event.pull_request.draft == false &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not the floating @v7 tag: this is a
      # pull_request_target job with write access, so the action is a
      # supply-chain-sensitive dependency.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const label = 'agent:review';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            // Ensure the label exists — a freshly onboarded repo may not have
            // seeded it yet, and addLabels would otherwise fail.
            try {
              await github.rest.issues.getLabel({ ...repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...repo, name: label, color: 'fbca04', description: 'PR ready for review' });
            }
            // Let a genuine failure surface (red run) rather than silently
            // leaving the PR unlabeled and never reviewed.
            await github.rest.issues.addLabels({ ...repo, issue_number: pr.number, labels: [label] });
            core.info(`Labeled PR #${pr.number} ${label} (author_association=${pr.author_association})`);
