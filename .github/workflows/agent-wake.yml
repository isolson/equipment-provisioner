name: Wake the llm01 agent loops

# Publishes a wake message to a secret ntfy topic when a label event moves a
# PR or issue into a loop's queue, so the matching timer loop on llm01 runs
# now instead of on its next 900 s tick. Latency only: the loops keep their
# own locks, budget gates, and label checks, so a duplicate or spurious wake
# is at worst one paced no-op run. llm01 subscribes outbound (CGNAT-safe) via
# dev-host/scripts/agent-wake-listener.sh. docs/agent-wake.md has the design.
# Both files are in the isolson/personal-processes hub repository.
# No AGENT_WAKE_URL secret configured = silent no-op, timers carry on alone.
#
# Safe use of pull_request_target: this workflow NEVER checks out or runs PR
# code. It only reads the event payload and POSTs a fixed-format string.
# agent-auto-review.yml sends the initial PR wake after it adds the label.

# zizmor reports pull_request_target as a dangerous trigger. The comment
# above gives the reason that this use is safe.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [labeled]
  issues:
    types: [labeled]

permissions: {}

jobs:
  wake:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent:ready') ||
      (github.event_name == 'pull_request_target' &&
       contains(fromJSON('["agent:review","agent:claude"]'), github.event.label.name))
    runs-on: ubuntu-latest
    steps:
      - name: Publish wake message
        env:
          WAKE_URL: ${{ secrets.AGENT_WAKE_URL }}
          WAKE_TOKEN: ${{ secrets.AGENT_WAKE_TOKEN }}
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$WAKE_URL" ]; then
            echo "AGENT_WAKE_URL secret not set; nothing to do"
            exit 0
          fi
          kind=""
          if [ "$EVENT" = "issues" ]; then
            kind="pickup"
          else
            case "$LABEL" in
              agent:review) kind="codex-review" ;;
              agent:claude) kind="review-fix" ;;
            esac
          fi
          if [ -z "$kind" ]; then
            echo "label '${LABEL:-<none>}' does not map to a loop; nothing to do"
            exit 0
          fi
          # Send the URL, the token, and the body to curl as a config file on
          # stdin. A secret in a curl argument is visible in ps. printf is a
          # shell builtin, so it starts no process that shows the secrets.
          # The escape function puts a backslash before each " and \ so the
          # config parser reads the value literally.
          esc() { printf '%s' "$1" | sed -e 's/[\\"]/\\&/g'; }
          publish() {
            {
              printf 'url = "%s"\n' "$(esc "$WAKE_URL")"
              printf 'header = "Title: agent-wake"\n'
              if [ -n "$WAKE_TOKEN" ]; then
                printf 'header = "Authorization: Bearer %s"\n' "$(esc "$WAKE_TOKEN")"
              fi
              printf 'data-binary = "repo=%s kind=%s"\n' "$(esc "$REPO")" "$kind"
            } | curl -fsS --max-time 10 --config -
            echo "published wake: kind=$kind repo=$REPO"
          }
          publish
