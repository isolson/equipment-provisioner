name: safety

# Four safety checks for each pull request and each push to main: a secret
# scan, two workflow checks, and a dependency audit. Each tool has a pinned
# version. Each downloaded binary has a pinned SHA-256. Each action has a
# pinned commit SHA.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Scan new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            log_opts="${PR_BASE}..${PR_HEAD}"
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # The push has no known parent commit. Scan the head commit only.
            log_opts="-1 ${PUSH_AFTER}"
          fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="$log_opts" --redact --no-banner --exit-code 1 .

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install zizmor
        run: |
          set -euo pipefail
          tarball="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${tarball}"
          echo "${ZIZMOR_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" zizmor
      - name: Audit workflows
        env:
          # The online audits read public action repositories. The job token
          # has read access only.
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor" --min-severity high .github/workflows/'

  pip-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PIP_AUDIT_VERSION: 2.10.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - name: Install pip-audit
        run: python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"
      - name: Audit requirements.txt
        # Put an accepted finding here as "--ignore-vuln <ID>", with a
        # one-line comment that gives the reason.
        run: pip-audit --requirement requirements.txt --progress-spinner off
